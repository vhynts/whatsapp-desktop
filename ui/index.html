<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #111b21;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .container {
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    .progress-bar {
      width: 320px;
      height: 3px;
      background-color: #202c33;
      border-radius: 2px;
      overflow: hidden;
      margin: 20px auto;
      position: relative;
    }
    .progress-fill {
      width: 40%;
      height: 100%;
      background-color: #00a884;
      border-radius: 2px;
      animation: progress 1.5s infinite ease-in-out;
    }
    @keyframes progress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #e9edef;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #8696a0;
    }
    .footer {
      position: absolute;
      bottom: 30px;
      font-size: 12px;
      color: #667781;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 175.216 175.552" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="85.915" x2="86.535" y1="32.567" y2="137.092" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#57d163"/>
          <stop offset="1" stop-color="#23b33a"/>
        </linearGradient>
      </defs>
      <path fill="#25d366" d="m12.966 161.238 10.439-38.114a73.42 73.42 0 0 1-9.821-36.772c.017-40.556 33.021-73.55 73.578-73.55 19.681.01 38.154 7.669 52.047 21.572s21.537 32.383 21.53 52.037c-.018 40.553-33.027 73.553-73.578 73.553h-.032c-12.313-.005-24.412-3.094-35.159-8.954z"/>
      <path fill="#fff" fill-rule="evenodd" d="M68.772 55.603c-1.378-3.061-2.828-3.123-4.137-3.176l-3.524-.043c-1.226 0-3.218.46-4.902 2.3s-6.435 6.287-6.435 15.332 6.588 17.785 7.506 19.013 12.718 20.381 31.405 27.75c15.529 6.124 18.689 4.906 22.061 4.6s10.877-4.447 12.408-8.74 1.532-7.971 1.073-8.74-1.685-1.226-3.525-2.146-10.877-5.367-12.562-5.981-2.91-.919-4.137.921-4.746 5.979-5.819 7.206-2.144 1.381-3.984.462-7.76-2.861-14.784-9.124c-5.465-4.873-9.154-10.891-10.228-12.73s-.114-2.835.808-3.751c.825-.824 1.838-2.147 2.759-3.22s1.224-1.84 1.836-3.065.307-2.301-.153-3.22-4.032-10.011-5.666-13.647"/>
    </svg>
    <h1>WhatsApp</h1>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p id="status">Connecting...</p>
  </div>
  <div class="footer">
    <span>🔒 End-to-end encrypted</span>
  </div>
  <script>
    // Redirect to WhatsApp Web
    window.location.replace("https://web.whatsapp.com");
  </script>
</body>
</html>
