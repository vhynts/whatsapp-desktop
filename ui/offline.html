<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp - Tidak Ada Koneksi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #111b21;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }
    .card {
      background-color: #1f2c34;
      border: 1px solid #2a3942;
      border-radius: 16px;
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background-color: #2a3942;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      fill: #8696a0;
    }
    h1 {
      font-size: 20px;
      font-weight: 500;
      color: #e9edef;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #8696a0;
      margin-bottom: 28px;
    }
    .btn-retry {
      background-color: #00a884;
      color: #111b21;
      border: none;
      border-radius: 24px;
      padding: 12px 36px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn-retry:hover {
      background-color: #06cf9c;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .status-text {
      margin-top: 24px;
      font-size: 13px;
      color: #667781;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #e0a320;
      border-radius: 50%;
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <!-- Disconnected Wi-Fi icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 2.22c3.78 0 7.23 1.48 9.81 3.93L12 19.04 2.19 10.15A14.68 14.68 0 0 1 12 6.22zM2.27 2.27l19.46 19.46-1.41 1.41L15.68 18.5A16.8 16.8 0 0 1 12 21L0 8.98c1.33-1.32 2.87-2.39 4.54-3.15L.86 2.41l1.41-1.41z"/>
      </svg>
    </div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Pastikan komputer Anda terhubung ke Wi-Fi atau jaringan kabel internet, lalu coba lagi.</p>
    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
      Coba Lagi
    </button>
    <div class="status-text">
      <div class="pulse-dot"></div>
      <span id="autoStatus">Mendeteksi koneksi otomatis...</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.innerText = 'Menghubungkan...';
      btn.style.opacity = '0.7';
      btn.disabled = true;
      window.location.href = 'https://web.whatsapp.com';
    }

    // Auto reconnect when browser detects online state
    window.addEventListener('online', () => {
      const status = document.getElementById('autoStatus');
      if (status) status.innerText = 'Koneksi kembali! Memuat WhatsApp...';
      setTimeout(() => {
        window.location.href = 'https://web.whatsapp.com';
      }, 600);
    });

    // Periodic check every 4 seconds
    setInterval(() => {
      if (navigator.onLine) {
        fetch('https://web.whatsapp.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
          .then(() => {
            const status = document.getElementById('autoStatus');
            if (status) status.innerText = 'Koneksi aktif! Mengalihkan...';
            window.location.href = 'https://web.whatsapp.com';
          })
          .catch(() => {});
      }
    }, 4000);
  </script>
</body>
</html>
